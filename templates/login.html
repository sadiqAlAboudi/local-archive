<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - الأرشيف المحلي</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الأرشيف المحلي">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-page="auth">
  <main>
    <header>
      <figure>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
          <path d="M6 6h10"></path>
          <path d="M6 10h10"></path>
          <path d="M6 14h6"></path>
        </svg>
      </figure>
      <h1>الأرشيف المحلي</h1>
      <p>نظام أرشفة وإدارة الوثائق والكتب الرسمية</p>
    </header>

    <form method="POST" action="/login">
      {{if .Error}}
      <aside role="alert">
        {{.Error}}
      </aside>
      {{end}}

      {{if .ShowDefaultNotice}}
      <aside role="note">
        بيانات الدخول الافتراضية: <strong>admin</strong> / <strong>admin</strong>
      </aside>
      {{end}}

      <fieldset>
        <label>
          اسم المستخدم
          <input type="text" name="username" required autofocus placeholder="أدخل اسم المستخدم">
        </label>

        <label>
          كلمة المرور
          <input type="password" name="password" required placeholder="أدخل كلمة المرور">
        </label>
      </fieldset>

      <button type="submit">تسجيل الدخول</button>
    </form>
  </main>
</body>
</html>
