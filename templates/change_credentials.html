<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغيير بيانات الدخول - الأرشيف المحلي</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الأرشيف المحلي">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-page="auth">
  <main>
    <header>
      <figure>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </figure>
      <h1>تغيير بيانات الدخول</h1>
      <p>يُرجى تعيين اسم مستخدم وكلمة مرور جديدة للمتابعة</p>
    </header>

    <form method="POST" action="/change-credentials">
      {{if .Error}}
      <aside role="alert">
        {{.Error}}
      </aside>
      {{end}}

      <aside role="note">
        لدواعي الأمان، يُطلب منك تغيير اسم المستخدم وكلمة المرور الافتراضية عند تسجيل الدخول الأول.
      </aside>

      <fieldset>
        <label>
          اسم المستخدم الجديد
          <input type="text" name="username" required autofocus placeholder="اختر اسم مستخدم جديد" value="{{.CurrentUsername}}">
        </label>

        <label>
          كلمة المرور الجديدة
          <input type="password" name="password" required placeholder="أدخل كلمة المرور الجديدة">
        </label>

        <label>
          تأكيد كلمة المرور الجديدة
          <input type="password" name="confirm_password" required placeholder="أعد إدخال كلمة المرور للتأكيد">
        </label>
      </fieldset>

      <button type="submit">حفظ وتأكيد الدخول للأرشيف</button>
    </form>
  </main>
</body>
</html>
