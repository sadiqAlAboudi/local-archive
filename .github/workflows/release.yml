name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install NSIS for Windows Installer Packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows Executable and NSIS Installer
        run: |
          wails build -platform windows/amd64 -nsis

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Local Archive ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            build/bin/LocalArchive-amd64-installer.exe
            build/bin/LocalArchive.exe
          generate_release_notes: true
          draft: false
          prerelease: false
