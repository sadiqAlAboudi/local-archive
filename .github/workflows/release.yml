name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install NSIS for Windows Installer Packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Sync Release Version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "Building release version: $VERSION"
          # Update version.go
          sed -i 's/var CurrentVersion = ".*"/var CurrentVersion = "'"$VERSION"'"/' internal/updater/version.go
          # Update wails.json
          sed -i 's/"productVersion": ".*"/"productVersion": "'"$VERSION"'"/' wails.json
          # Update wails_tools.nsh
          sed -i 's/!define INFO_PRODUCTVERSION ".*"/!define INFO_PRODUCTVERSION "'"$VERSION"'"/' build/windows/installer/wails_tools.nsh

      - name: Prepare Bundled NAPS2 Scanner Engine
        shell: bash
        run: |
          mkdir -p build/bin/naps2
          mkdir -p naps2_temp
          NAPS2_URL=$(curl -s "https://api.github.com/repos/cyanfish/naps2/releases/latest" | grep -o 'https://[^"]*naps2-[^"]*-win-x64\.zip' | head -n 1)
          if [ -z "$NAPS2_URL" ]; then
            NAPS2_URL="https://github.com/cyanfish/naps2/releases/download/v8.6.0/naps2-8.6.0-win-x64.zip"
          fi
          echo "Downloading NAPS2 from: $NAPS2_URL"
          curl -fsSL -o naps2.zip "$NAPS2_URL"
          unzip -q naps2.zip -d naps2_temp
          if [ -f naps2_temp/NAPS2.Console.exe ]; then
            cp -r naps2_temp/* build/bin/naps2/
          else
            cp -r naps2_temp/*/* build/bin/naps2/
          fi
          rm -rf naps2.zip naps2_temp
          ls -la build/bin/naps2/ | head -n 15

      - name: Build Windows Executable and NSIS Installer
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          wails build -platform windows/amd64 -nsis -ldflags "-X local-archive/internal/updater.CurrentVersion=$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Local Archive ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            build/bin/LocalArchive-amd64-installer.exe
            build/bin/LocalArchive.exe
          generate_release_notes: true
          draft: false
          prerelease: false
